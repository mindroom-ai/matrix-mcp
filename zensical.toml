# Matrix MCP Documentation Site Configuration
# Built with Zensical - https://zensical.org

[project]
site_name = "Matrix MCP"
site_description = "The complete Matrix toolkit for AI agents: 43 MCP tools, end-to-end encryption, Matrix SSO, and multi-user HTTP."
site_author = "MindRoom"
site_url = "https://matrix-mcp.mindroom.chat/"
copyright = "Copyright &copy; 2026 <a href=\"https://mindroom.chat\">MindRoom</a> · MIT License"
extra_css = ["stylesheets/extra.css"]

repo_url = "https://github.com/mindroom-ai/matrix-mcp"
repo_name = "GitHub"
edit_uri = "edit/main/docs"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Tool Reference" = "usage.md" },
  { "Encryption" = "encryption.md" },
  { "Authenticated HTTP" = "hosted.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo-static.svg"

features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to system preference"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/mindroom-ai/matrix-mcp"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/matrix-mcp/"
name = "PyPI"

[[project.extra.social]]
icon = "lucide/house"
link = "https://mindroom.chat"
name = "MindRoom"

[project.markdown_extensions.gfm_admonition]

[project.markdown_extensions.admonition]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
