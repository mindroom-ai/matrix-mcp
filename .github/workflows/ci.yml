name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Run tests
        run: uv run --extra dev pytest
      - name: Run ruff
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev ruff format --check .
      - name: Build package
        run: uv build
